[project]
name = "bpp"
version = "0.1.0"
description = "Bin packing 2D com servidores heterogêneos (alocação de VMs) via Gurobi e SCIP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "gurobipy>=11.0",
    "pyscipopt>=5.0",
]

[project.scripts]
bpp-dataset = "bpp.dados.azure:main"
bpp-sintetico = "bpp.dados.sintetico:main"
bpp-solvers = "bpp.experimentos.rodar:main"
bpp-tabela = "bpp.experimentos.tabela:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
